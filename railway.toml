[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# SECRET_KEY, DATABASE_URL, APP_URL, STRIPE_* — set in Railway Dashboard → Variables
# Do NOT hardcode secrets here.

[[variables]]
key = "APP_URL"
value = "https://meshtostep.up.railway.app"

[[variables]]
key = "FREE_CREDITS"
value = "3"

[[variables]]
key = "MAX_FILE_MB"
value = "200"

[[variables]]
key = "STRIPE_CURRENCY"
value = "usd"

[[variables]]
key = "CORS_ORIGINS"
value = "https://meshtostep.up.railway.app"
